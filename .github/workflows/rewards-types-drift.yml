name: Rewards Types Drift

# Phase 1 of RFC #8862 made pkg/rewards/tiers.go the canonical source for
# contributor rank tiers. web/src/types/rewards.generated.ts is produced
# from that Go file by scripts/gen-tiers-ts.go (integrated into web/package.json).
# This workflow uses scripts/check-tiers-drift.sh to verify sync.

on:
  pull_request:
    paths:
      - 'pkg/rewards/**.go'
      - 'scripts/gen-tiers-ts.go'
      - 'scripts/check-tiers-drift.sh'
      - 'web/src/types/rewards.generated.ts'
      - 'web/src/types/rewards.ts'
      - '.github/workflows/rewards-types-drift.yml'
  push:
    branches: [main]
    paths:
      - 'pkg/rewards/**.go'
      - 'scripts/gen-tiers-ts.go'
      - 'scripts/check-tiers-drift.sh'
      - 'web/src/types/rewards.generated.ts'
      - 'web/src/types/rewards.ts'
      - '.github/workflows/rewards-types-drift.yml'
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch so we don't queue stale work.
concurrency:
  group: rewards-types-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Verify rewards.generated.ts matches Go source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56d941b73109b3046bc79c63c005fbc64b # v5.2.0
        with:
          go-version: '1.23'
          cache: true

      - name: Run drift check
        run: bash scripts/check-tiers-drift.sh
